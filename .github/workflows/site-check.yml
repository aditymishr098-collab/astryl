# Builds the website on every pull request that changes it, so a broken build
# is caught before it reaches main.
name: Site check

on:
  pull_request:
    paths:
      - 'data/**'
      - 'tools/**'
      - 'site/**'
      - 'supabase/**'
      - '.github/workflows/site-check.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow, NumPy (pictures) and fontTools (web fonts)
        run: pip install pillow numpy fonttools==4.66.1
      - name: Build the site
        run: python3 tools/build_site.py
