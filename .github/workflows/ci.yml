name: CI

# Checks every push to main and every pull request.
# It does not build a release; releases still come from version tags (release.yml).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: Flutter 3.50 (Nov 2026) needs a newer Android Gradle Plugin and
          # deprecates material.dart. Move up on purpose, not by surprise.
          flutter-version: 3.47.9
          cache: true

      - run: flutter pub get

      - run: flutter gen-l10n

      - run: flutter analyze

      - run: flutter test
