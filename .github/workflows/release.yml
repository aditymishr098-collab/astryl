name: Release

# Builds a signed APK when a version tag (for example v1.0.0) is pushed and
# attaches it to a GitHub release.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    the .jks file encoded as base64
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias (heliora)
#   KEY_PASSWORD       key password

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: Flutter 3.50 (Nov 2026) needs a newer Android Gradle Plugin and
          # deprecates material.dart. Move up on purpose, not by surprise.
          flutter-version: 3.47.9
          cache: true

      - run: flutter pub get

      - run: flutter gen-l10n

      - run: flutter build apk --release

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -f -p 4 build/app/outputs/flutter-apk/app-release.apk aligned.apk
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "Astryl-${GITHUB_REF_NAME}.apk" \
            aligned.apk
          "$BT/apksigner" verify --print-certs "Astryl-${GITHUB_REF_NAME}.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: softprops/action-gh-release@v3
        with:
          files: Astryl-*.apk
          generate_release_notes: true
