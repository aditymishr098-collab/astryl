name: Website

# Publishes the folder site/ to https://astryl.space with GitHub Pages.
# Needs Settings > Pages > Source = "GitHub Actions" (set once).
# site/ is made by `python3 tools/build_site.py` from the data in data/. The workflow builds it
# again before publishing, and runs twice a day so the "Night sky tonight" pages stay current.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '17 0 * * *'
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the site
        run: |
          pip install pillow numpy fonttools==4.66.1
          python3 tools/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
