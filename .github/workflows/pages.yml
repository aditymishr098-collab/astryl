name: Website

# Validates and optionally publishes the folder site/ to Firebase Hosting (astryl-space) and GitHub Pages.
# site/ is made by `python3 tools/build_site.py` from the app's own data.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        if: env.HAS_FIREBASE_SA == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: astryl-space

      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: site
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

