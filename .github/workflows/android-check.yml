name: Android build check

# Builds a debug APK when native Android files change, so a mistake in Kotlin,
# XML or the manifest shows up on the pull request and not at release time.

on:
  pull_request:
    paths:
      - 'android/**'
      - 'pubspec.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build apk --debug
