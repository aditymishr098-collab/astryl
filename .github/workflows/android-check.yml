name: Android build check

# Builds a debug APK when native Android files change, so a mistake in Kotlin,
# XML or the manifest shows up on the pull request and not at release time.

on:
  pull_request:
    paths:
      - 'android/**'
      - 'pubspec.yaml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: Flutter 3.50 (Nov 2026) needs a newer Android Gradle Plugin and
          # deprecates material.dart. Move up on purpose, not by surprise.
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build apk --debug
