# Checks Firebase Cloud Firestore public stats endpoint periodically.
name: Keep Firebase stats warm

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask for the public counter
        run: |
          curl --silent --show-error --max-time 30 \
            "https://firestore.googleapis.com/v1/projects/astryl-space/databases/(default)/documents/stats/global" > /dev/null || true

