# One-time helper: downloads the star photos on a GitHub runner and commits them
# to the pull request branch. Removed again after use.
name: Fetch star photos

on:
  pull_request:
    paths:
      - 'tools/media/fetch_stars.py'

permissions:
  contents: write

jobs:
  fetch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 tools/media/fetch_stars.py
      - name: Commit the files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/photos/space
          git commit -m "Add star photos (fetched by the Fetch star photos workflow)" || echo "nothing new"
          git push
