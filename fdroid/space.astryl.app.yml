Categories:
  - Science & Education
License: AGPL-3.0-only
AuthorName: Astryl
WebSite: https://github.com/aditymishr098-collab/astryl
SourceCode: https://github.com/aditymishr098-collab/astryl
IssueTracker: https://github.com/aditymishr098-collab/astryl/issues

AutoName: Astryl

RepoType: git
Repo: https://github.com/aditymishr098-collab/astryl.git

Builds:
  - versionName: 1.16.1
    versionCode: 18
    commit: v1.16.1
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@FLUTTER_VERSION
    prebuild:
      - sed -i -e '/REQUEST_INSTALL_PACKAGES/d' android/app/src/main/AndroidManifest.xml
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter gen-l10n
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --dart-define=FDROID=true

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.16.1
